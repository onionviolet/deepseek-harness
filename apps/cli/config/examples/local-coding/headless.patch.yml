# Opt-in text coding tool set. Permission, persistence and guard rows are inherited.
- id: tool-fs
  config:
    readImage: false
- id: tool-subagent-control
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-goal
  disabled: true
- id: command-goal
  disabled: true
- id: tool-web
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-todo
  disabled: true
- id: plan-mode
  disabled: true
# This route's 32K context needs less than the 64K default compaction reserve.
- id: compaction-basic
  config:
    modelPolicies:
      - provider: ollama-local
        model: qwen3.8:27b
        headroomTokens: 4096
        maxTokens: 4096
        retainTokens: 4096
